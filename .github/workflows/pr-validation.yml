name: PR Validation

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pr-validation-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: evh_test
          POSTGRES_PASSWORD: evh_test
          POSTGRES_DB: evh_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U evh_test -d evh_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install backend dependencies
        run: python -m pip install --upgrade pip && python -m pip install -r requirements.txt

      - name: Compile Python sources
        run: python -m compileall -q .

      - name: Run backend tests
        env:
          APP_DATA_DIR: ${{ runner.temp }}/evh-test-data
          TERM: xterm
          EVH_TEST_POSTGRES_HOST: 127.0.0.1
          EVH_TEST_POSTGRES_PORT: "5432"
          EVH_TEST_POSTGRES_USER: evh_test
          EVH_TEST_POSTGRES_PASSWORD: evh_test
          EVH_TEST_POSTGRES_DB: evh_test
        run: python -m unittest discover -s tests -p 'test_*.py' -v

  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: emby-actor-ui
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install frontend dependencies
        run: npm install --no-fund --legacy-peer-deps

      - name: Run MediaInfo response ordering tests
        run: npm run test:mediainfo

      - name: Build frontend
        run: npm run build
